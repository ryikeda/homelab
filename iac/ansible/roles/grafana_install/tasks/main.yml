---
- name: Ensure the admin password is set
  ansible.builtin.assert:
    that:
      - grafana_install_admin_password | default('') | length > 0
    fail_msg: >-
      grafana_install_admin_password is empty - set a real password in local.yml.

- name: Ensure the Grafana stack directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0755"
  loop:
    - "{{ grafana_install_dir }}"
    - "{{ grafana_install_dir }}/provisioning/datasources"
    - "{{ grafana_install_dir }}/provisioning/dashboards"
    - "{{ grafana_install_dir }}/dashboards"

# The official image runs as UID 472 (grafana), not root - same reasoning
# as the Prometheus data directory in prometheus_install.
- name: Ensure the Grafana data directory exists with the container's UID
  ansible.builtin.file:
    path: "{{ grafana_install_dir }}/data"
    state: directory
    owner: "472"
    group: "472"
    mode: "0755"
    recurse: true

- name: Deploy the Prometheus datasource provisioning file
  ansible.builtin.template:
    src: prometheus-datasource.yaml.j2
    dest: "{{ grafana_install_dir }}/provisioning/datasources/prometheus.yaml"
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0644"
  register: grafana_install_datasource_file

- name: Deploy the dashboards provider configuration
  ansible.builtin.template:
    src: dashboards-provider.yaml.j2
    dest: "{{ grafana_install_dir }}/provisioning/dashboards/dashboards.yaml"
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0644"
  register: grafana_install_dashboards_provider_file

# Grafana's file provider polls this directory itself (updateIntervalSeconds
# in dashboards-provider.yaml.j2) - no restart needed for the dashboards
# themselves, only for the provider config above.
- name: Deploy the dashboard JSON files
  ansible.builtin.copy:
    src: dashboards/
    dest: "{{ grafana_install_dir }}/dashboards/"
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0644"

- name: Deploy the Grafana compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ grafana_install_dir }}/compose.yaml"
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0644"
  register: grafana_install_compose_file

- name: Start the Grafana stack
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ grafana_install_dir }}"
  when: grafana_install_compose_file.changed

- name: Restart Grafana if the datasource or dashboards-provider config changed
  ansible.builtin.command: docker compose restart
  args:
    chdir: "{{ grafana_install_dir }}"
  when: >-
    (grafana_install_datasource_file.changed or grafana_install_dashboards_provider_file.changed)
    and not grafana_install_compose_file.changed
