---
# Bump deliberately - check https://hub.docker.com/r/grafana/grafana/tags.
grafana_version: "13.1.1"

grafana_dir: "{{ docker_stacks_dir }}/grafana"
grafana_port: 3000

grafana_admin_user: admin
# Real value lives in local.yml - kept out of git, same pattern as
# traefik_dashboard_password_hash. Only takes effect on Grafana's very
# first start (when it creates the admin account) - changing it afterward
# requires `docker exec ... grafana cli admin reset-admin-password`.
grafana_admin_password: ""

grafana_prometheus_url: "http://localhost:{{ prometheus_port }}"
