---
- name: Ensure the Cloudflare API token is available
  ansible.builtin.assert:
    that:
      - traefik_cloudflare_api_token | default('') | length > 0
    fail_msg: >-
      traefik_cloudflare_api_token is empty - mint a Cloudflare API token
      (Zone:DNS:Edit, scoped to the ikeda.codes zone) and save it to
      ~/.cloudflare/ansible.env on the controller. See README.md.

- name: Ensure the dashboard credentials are set
  ansible.builtin.assert:
    that:
      - traefik_dashboard_user | default('') | length > 0
      - traefik_dashboard_password_hash | default('') | length > 0
    fail_msg: >-
      traefik_dashboard_user/traefik_dashboard_password_hash must be set -
      generate a hash with: openssl passwd -apr1

- name: Install ca-certificates
  ansible.builtin.apt:
    name: ca-certificates
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"

- name: Create the traefik system group
  ansible.builtin.group:
    name: "{{ traefik_group }}"
    system: true

- name: Create the traefik system user
  ansible.builtin.user:
    name: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: "{{ traefik_data_dir }}"

- name: Ensure Traefik config and data directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0750"
  loop:
    - "{{ traefik_config_dir }}"
    - "{{ traefik_dynamic_config_dir }}"
    - "{{ traefik_data_dir }}"

- name: Check the currently installed Traefik version marker
  ansible.builtin.stat:
    path: "{{ traefik_version_marker }}"
  register: traefik_version_marker_stat

- name: Read the current version marker contents
  ansible.builtin.slurp:
    src: "{{ traefik_version_marker }}"
  register: traefik_version_marker_contents
  when: traefik_version_marker_stat.stat.exists

- name: Determine whether Traefik needs to be (re)installed
  ansible.builtin.set_fact:
    traefik_install_needed: >-
      {{ not traefik_version_marker_stat.stat.exists
         or (traefik_version_marker_contents.content | b64decode | trim) != traefik_version }}

- name: Download and install the Traefik binary
  when: traefik_install_needed
  block:
    - name: Download the Traefik release archive
      ansible.builtin.get_url:
        url: "https://github.com/traefik/traefik/releases/download/{{ traefik_version }}/traefik_{{ traefik_version }}_linux_amd64.tar.gz"
        dest: /tmp/traefik.tar.gz
        mode: "0644"

    - name: Extract the traefik binary
      ansible.builtin.unarchive:
        src: /tmp/traefik.tar.gz
        dest: /tmp
        remote_src: true
        include:
          - traefik

    - name: Install the traefik binary
      ansible.builtin.copy:
        src: /tmp/traefik
        dest: "{{ traefik_binary_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Remove downloaded archive/binary staging files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/traefik.tar.gz
        - /tmp/traefik

    - name: Record the installed version marker
      ansible.builtin.copy:
        content: "{{ traefik_version }}\n"
        dest: "{{ traefik_version_marker }}"
        owner: root
        group: root
        mode: "0644"

- name: Deploy the static Traefik configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_config_dir }}/traefik.yml"
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0644"
  notify: restart traefik

- name: Deploy the dynamic Traefik configuration
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: "{{ traefik_dynamic_config_dir }}/dynamic.yml"
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0644"
  notify: restart traefik

- name: Deploy the Cloudflare API token env file
  ansible.builtin.copy:
    content: "CF_DNS_API_TOKEN={{ traefik_cloudflare_api_token }}\n"
    dest: "{{ traefik_config_dir }}/cloudflare.env"
    owner: "{{ traefik_user }}"
    group: "{{ traefik_group }}"
    mode: "0600"
  no_log: true
  notify: restart traefik

- name: Deploy the traefik systemd unit
  ansible.builtin.template:
    src: traefik.service.j2
    dest: /etc/systemd/system/traefik.service
    owner: root
    group: root
    mode: "0644"
  notify: restart traefik

- name: Ensure the traefik service is enabled and running
  ansible.builtin.systemd:
    name: traefik
    enabled: true
    state: started
    daemon_reload: true
