---
# Bump deliberately - check https://github.com/traefik/traefik/releases.
traefik_version: "v3.7.9"

traefik_binary_path: /usr/local/bin/traefik
traefik_version_marker: /usr/local/lib/traefik-install-version
traefik_config_dir: /etc/traefik
traefik_dynamic_config_dir: "{{ traefik_config_dir }}/dynamic"
traefik_data_dir: /var/lib/traefik

traefik_user: traefik
traefik_group: traefik

# Declared reverse-proxy targets - see group_vars/all/reverse_proxy_sites.yml
# for the real list (same declared-list pattern as technitium_dns_records).
reverse_proxy_sites: []
