---
- name: Ensure LVM utilities are present
  ansible.builtin.apt:
    name: lvm2
    state: present
  when:
    - proxmox_storage_manage | bool
    - ansible_facts.os_family == "Debian"

- name: Configure additional VM storage disks
  when: proxmox_storage_manage | bool
  block:
    - name: Check existing LVM physical volumes
      ansible.builtin.command: pvs --noheadings -o pv_name
      register: proxmox_storage_pv_raw
      changed_when: false
      check_mode: false

    - name: Check existing LVM volume groups
      ansible.builtin.command: vgs --noheadings -o vg_name
      register: proxmox_storage_vg_raw
      changed_when: false
      check_mode: false

    - name: Check registered Proxmox storage
      ansible.builtin.command: pvesm status
      register: proxmox_storage_status
      changed_when: false
      check_mode: false

    - name: Record known physical volumes and volume groups
      ansible.builtin.set_fact:
        proxmox_storage_pvs: "{{ proxmox_storage_pv_raw.stdout_lines | map('trim') | list }}"
        proxmox_storage_vgs: "{{ proxmox_storage_vg_raw.stdout_lines | map('trim') | list }}"

    - name: Inspect filesystem signature on target disks
      ansible.builtin.command: blkid -o value -s TYPE {{ item.device }}
      register: proxmox_storage_blkid
      changed_when: false
      failed_when: false
      check_mode: false
      loop: "{{ proxmox_storage_disks }}"
      loop_control:
        label: "{{ item.device }}"

    - name: Refuse to touch disks with an unexpected filesystem signature
      ansible.builtin.fail:
        msg: >-
          {{ item.item.device }} already has a '{{ item.stdout }}' filesystem signature.
          Refusing to overwrite it with an LVM physical volume; wipe it manually first
          (e.g. wipefs -a {{ item.item.device }}) once you're sure it's unused.
      loop: "{{ proxmox_storage_blkid.results }}"
      loop_control:
        label: "{{ item.item.device }}"
      when:
        - item.item.device not in proxmox_storage_pvs
        - item.stdout | default('') | length > 0
        - item.stdout != 'LVM2_member'

    - name: Create LVM physical volumes on target disks
      ansible.builtin.command: pvcreate {{ item.device }}
      loop: "{{ proxmox_storage_disks }}"
      loop_control:
        label: "{{ item.device }}"
      when: item.device not in proxmox_storage_pvs
      changed_when: true

    - name: Create LVM volume groups for target disks
      ansible.builtin.command: vgcreate {{ item.vg_name }} {{ item.device }}
      loop: "{{ proxmox_storage_disks }}"
      loop_control:
        label: "{{ item.vg_name }}"
      when: item.vg_name not in proxmox_storage_vgs
      changed_when: true

    # --separator so each line is already "vgname/lvname" - lvs's default
    # column output is fixed-width padded, not single-space-separated, so
    # naively splitting on a space would break.
    - name: Check existing LVM logical volumes
      ansible.builtin.command: lvs --noheadings -o vg_name,lv_name --separator /
      register: proxmox_storage_lv_raw
      changed_when: false
      check_mode: false

    - name: Record known logical volumes
      ansible.builtin.set_fact:
        proxmox_storage_lvs: "{{ proxmox_storage_lv_raw.stdout_lines | map('trim') | list }}"

    # -l 95%FREE, not 100% - a thin pool's metadata volume needs room to
    # autogrow, and lvcreate rejects carving one out of a completely full VG.
    - name: Create LVM thin pools
      ansible.builtin.command: >-
        lvcreate --type thin-pool -l 95%FREE
        --thinpool {{ item.thinpool_name | default(item.vg_name + '-thin') }}
        {{ item.vg_name }}
      loop: "{{ proxmox_storage_disks }}"
      loop_control:
        label: "{{ item.vg_name }}"
      when: >-
        (item.type | default('lvm')) == 'lvmthin'
        and (item.vg_name + '/' + (item.thinpool_name | default(item.vg_name + '-thin'))) not in proxmox_storage_lvs
      changed_when: true

    - name: Register volume groups as thick Proxmox VM storage
      ansible.builtin.command:
        argv:
          - pvesm
          - add
          - lvm
          - "{{ item.storage_id }}"
          - --vgname
          - "{{ item.vg_name }}"
          - --content
          - "{{ item.content | default('images,rootdir') }}"
      loop: "{{ proxmox_storage_disks }}"
      loop_control:
        label: "{{ item.storage_id }}"
      when: >-
        (item.type | default('lvm')) == 'lvm'
        and (proxmox_storage_status.stdout_lines | select('match', '^' + item.storage_id + '\s') | list | length) == 0
      changed_when: true

    - name: Register thin pools as thin-provisioned Proxmox VM storage
      ansible.builtin.command:
        argv:
          - pvesm
          - add
          - lvmthin
          - "{{ item.storage_id }}"
          - --vgname
          - "{{ item.vg_name }}"
          - --thinpool
          - "{{ item.thinpool_name | default(item.vg_name + '-thin') }}"
          - --content
          - "{{ item.content | default('images,rootdir') }}"
      loop: "{{ proxmox_storage_disks }}"
      loop_control:
        label: "{{ item.storage_id }}"
      when: >-
        (item.type | default('lvm')) == 'lvmthin'
        and (proxmox_storage_status.stdout_lines | select('match', '^' + item.storage_id + '\s') | list | length) == 0
      changed_when: true

    - name: Report configured VM storage
      ansible.builtin.debug:
        msg: >-
          Storage '{{ item.storage_id }}' ({{ item.vg_name }} on {{ item.device }})
          is configured for content: {{ item.content | default('images,rootdir') }}.
      loop: "{{ proxmox_storage_disks }}"
      loop_control:
        label: "{{ item.storage_id }}"

- name: Converge content types on existing storage entries
  when:
    - proxmox_storage_manage | bool
    - proxmox_storage_content | length > 0
  block:
    - name: Read current configuration for each storage entry
      ansible.builtin.command:
        argv:
          - pvesh
          - get
          - "/storage/{{ item.key }}"
          - --output-format
          - json
      register: proxmox_storage_content_current
      changed_when: false
      check_mode: false
      loop: "{{ proxmox_storage_content | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Update content types where they've drifted
      ansible.builtin.command:
        argv:
          - pvesm
          - set
          - "{{ item.item.key }}"
          - --content
          - "{{ item.item.value | join(',') }}"
      loop: "{{ proxmox_storage_content_current.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      when: >-
        ((item.stdout | from_json).content | default('') | split(',') | reject('equalto', '') | sort | list)
        != (item.item.value | sort | list)
      changed_when: true
