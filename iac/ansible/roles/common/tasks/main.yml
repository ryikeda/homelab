---
- name: Install common packages on Debian-family hosts
  ansible.builtin.apt:
    name: "{{ common_packages + (linux_common_packages | default([])) }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - ansible_facts.os_family == "Debian"
    - (common_packages + (linux_common_packages | default([]))) | length > 0

- name: Ensure the guest hostname matches its Ansible inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when:
    - ansible_facts.os_family == "Debian"
    - "'proxmox' not in group_names"

- name: Ensure /etc/hosts resolves the hostname locally
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1\t{{ inventory_hostname }}"
    state: present
  when:
    - ansible_facts.os_family == "Debian"
    - "'proxmox' not in group_names"

- name: Ensure the systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when:
    - ansible_facts.os_family == "Debian"
    - "'proxmox' not in group_names"

- name: Point systemd-resolved at the internal DNS server
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/homelab-dns.conf
    content: |
      [Resolve]
      DNS={{ opnsense_host }}
      Domains={{ local_domain }}
    owner: root
    group: root
    mode: "0644"
  when:
    - ansible_facts.os_family == "Debian"
    - "'proxmox' not in group_names"
  notify: restart systemd-resolved
