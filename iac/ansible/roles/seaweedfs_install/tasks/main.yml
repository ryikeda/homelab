---
- name: Ensure the SeaweedFS stack directory exists
  ansible.builtin.file:
    path: "{{ seaweedfs_install_dir }}"
    state: directory
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0755"

- name: Deploy the SeaweedFS S3 credentials file
  ansible.builtin.template:
    src: s3.json.j2
    dest: "{{ seaweedfs_install_dir }}/s3.json"
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0600"
  register: seaweedfs_install_s3_config

- name: Deploy the SeaweedFS compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ seaweedfs_install_dir }}/compose.yaml"
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0644"
  register: seaweedfs_install_compose_file

- name: Start the SeaweedFS stack
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ seaweedfs_install_dir }}"
  when: seaweedfs_install_compose_file.changed or seaweedfs_install_s3_config.changed
