---
- name: "Check whether the template VM already exists: {{ vm_template.name }}"
  ansible.builtin.command: qm status {{ vm_template.vmid }}
  register: proxmox_vm_template_status
  changed_when: false
  failed_when: false

# qm status only checks the VM's config object exists, not that its disk
# does - a VG/pool rebuild can destroy the disk while leaving the config
# object behind.
- name: "Read the existing template's config: {{ vm_template.name }}"
  ansible.builtin.command: qm config {{ vm_template.vmid }}
  register: proxmox_vm_template_config
  changed_when: false
  when: proxmox_vm_template_status.rc == 0

- name: "List volumes on the template's storage: {{ vm_template.name }}"
  ansible.builtin.command: pvesm list {{ vm_template.storage }}
  register: proxmox_vm_template_storage_list
  changed_when: false
  when: proxmox_vm_template_status.rc == 0

- name: "Fail if the template's config survived but its disk didn't: {{ vm_template.name }}"
  vars:
    proxmox_vm_template_scsi0_volid: >-
      {{ proxmox_vm_template_config.stdout
      | default('') | regex_search('^scsi0:\s*([^,\n]+)', '\1', multiline=True)
      | first | default('') | trim }}
  ansible.builtin.fail:
    msg: >-
      VM {{ vm_template.vmid }} ({{ vm_template.name }}) exists in Proxmox's
      config but its boot disk ('{{ proxmox_vm_template_scsi0_volid }}') is
      missing or absent from storage '{{ vm_template.storage }}' - likely left
      behind by a storage rebuild. Remove the stale VM object first
      (qm destroy {{ vm_template.vmid }}) once you're sure it's safe, then
      re-run this playbook to rebuild the template from scratch.
  when:
    - proxmox_vm_template_status.rc == 0
    - >-
      proxmox_vm_template_scsi0_volid | length == 0
      or (proxmox_vm_template_storage_list.stdout_lines | select('match', '^' + proxmox_vm_template_scsi0_volid + '\s') | list | length) == 0

- name: "Build the template: {{ vm_template.name }}"
  when: proxmox_vm_template_status.rc != 0
  block:
    - name: "Download the cloud image: {{ vm_template.name }}"
      ansible.builtin.get_url:
        url: "{{ vm_template.image_url }}"
        dest: "{{ proxmox_vm_template_templates_download_dir }}/{{ vm_template.name }}.img"
        checksum: "{{ vm_template.image_checksum | default(omit) }}"
        mode: "0644"

    - name: "Create the base VM: {{ vm_template.name }}"
      ansible.builtin.command:
        argv:
          - qm
          - create
          - "{{ vm_template.vmid }}"
          - --name
          - "{{ vm_template.name }}"
          - --memory
          - "{{ vm_template.memory | default(2048) }}"
          - --cores
          - "{{ vm_template.cores | default(2) }}"
          - --net0
          - "virtio,bridge={{ vm_template.bridge | default('vmbr0') }}"
          - --machine
          - "{{ vm_template.machine | default('q35') }}"
          - --bios
          - "{{ vm_template.bios | default('seabios') }}"
          - --scsihw
          - virtio-scsi-pci
          - --agent
          - "enabled=1"
          - --serial0
          - socket
          - --vga
          - serial0
      changed_when: true

    - name: "Add an EFI disk for OVMF firmware: {{ vm_template.name }}"
      ansible.builtin.command: >-
        qm set {{ vm_template.vmid }}
        --efidisk0 {{ vm_template.storage }}:0,efitype=4m,pre-enrolled-keys=0
      when: (vm_template.bios | default('seabios')) == 'ovmf'
      changed_when: true

    - name: "Import the downloaded disk: {{ vm_template.name }}"
      ansible.builtin.command: >-
        qm importdisk {{ vm_template.vmid }}
        {{ proxmox_vm_template_templates_download_dir }}/{{ vm_template.name }}.img
        {{ vm_template.storage }}
      changed_when: true

    - name: "Attach the imported disk as scsi0: {{ vm_template.name }}"
      ansible.builtin.command: >-
        qm set {{ vm_template.vmid }}
        --scsi0 {{ vm_template.storage }}:vm-{{ vm_template.vmid }}-disk-0
      changed_when: true

    - name: "Grow the disk to the requested size: {{ vm_template.name }}"
      ansible.builtin.command: qm resize {{ vm_template.vmid }} scsi0 {{ vm_template.disk_size }}
      when: vm_template.disk_size is defined
      changed_when: true

    - name: "Attach a cloud-init drive: {{ vm_template.name }}"
      ansible.builtin.command: qm set {{ vm_template.vmid }} --ide2 {{ vm_template.storage }}:cloudinit
      when: vm_template.cloud_init | default(true)
      changed_when: true

    - name: "Set the boot disk: {{ vm_template.name }}"
      ansible.builtin.command: qm set {{ vm_template.vmid }} --boot order=scsi0
      changed_when: true

    - name: "Convert the VM into a template: {{ vm_template.name }}"
      ansible.builtin.command: qm template {{ vm_template.vmid }}
      changed_when: true

- name: "Report template status: {{ vm_template.name }}"
  ansible.builtin.debug:
    msg: >-
      Template '{{ vm_template.name }}' (vmid {{ vm_template.vmid }})
      {{
        ('was created from ' + vm_template.image_url)
        if proxmox_vm_template_status.rc != 0
        else 'already exists; skipped. Delete the VM and re-run to rebuild it.'
      }}
