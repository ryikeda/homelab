---
- name: Add the Argo CD Helm repo
  ansible.builtin.command: helm repo add argo https://argoproj.github.io/argo-helm
  register: argocd_install_helm_repo_add
  changed_when: "'already exists' not in argocd_install_helm_repo_add.stdout"

- name: Update the Argo CD Helm repo
  ansible.builtin.command: helm repo update argo
  changed_when: true

- name: Install or upgrade the Argo CD Helm release
  ansible.builtin.command: >-
    helm upgrade --install argocd argo/argo-cd
    --namespace {{ argocd_install_namespace }}
    --create-namespace
    --version {{ argocd_install_chart_version }}
    --set configs.params."server\.insecure"=true
    --wait
  environment:
    KUBECONFIG: "{{ k3s_kubeconfig_path }}"
  changed_when: true

- name: Copy the Argo CD IngressRoute manifest
  ansible.builtin.copy:
    src: argocd-ingressroute.yaml
    dest: /tmp/argocd-ingressroute.yaml
    mode: "0644"

# The Traefik ingress controller's CRDs need to already be installed
# (iac/argocd/apps/ingress-controller.yaml) - retry rather than race it.
- name: Apply the Argo CD IngressRoute manifest
  ansible.builtin.command: kubectl apply -f /tmp/argocd-ingressroute.yaml
  environment:
    KUBECONFIG: "{{ k3s_kubeconfig_path }}"
  register: argocd_install_ingressroute_apply
  changed_when: true
  retries: 5
  delay: 5
  until: argocd_install_ingressroute_apply.rc == 0

- name: Remove the copied IngressRoute manifest
  ansible.builtin.file:
    path: /tmp/argocd-ingressroute.yaml
    state: absent
