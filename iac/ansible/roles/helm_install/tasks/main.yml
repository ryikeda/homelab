---
- name: Check the currently installed Helm version marker
  ansible.builtin.stat:
    path: "{{ helm_install_version_marker }}"
  register: helm_install_version_marker_stat

- name: Read the current Helm version marker contents
  ansible.builtin.slurp:
    src: "{{ helm_install_version_marker }}"
  register: helm_install_version_marker_contents
  when: helm_install_version_marker_stat.stat.exists

- name: Determine whether Helm needs to be (re)installed
  ansible.builtin.set_fact:
    helm_install_needed: >-
      {{ not helm_install_version_marker_stat.stat.exists
         or (helm_install_version_marker_contents.content | b64decode | trim) != helm_install_version }}

- name: Download, extract, and install Helm
  when: helm_install_needed
  block:
    - name: Download the Helm release archive
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-v{{ helm_install_version }}-linux-amd64.tar.gz"
        dest: /tmp/helm.tar.gz
        mode: "0644"

    - name: Extract the Helm binary
      ansible.builtin.unarchive:
        src: /tmp/helm.tar.gz
        dest: /tmp
        remote_src: true
        include:
          - linux-amd64/helm

    - name: Install the Helm binary
      ansible.builtin.copy:
        src: /tmp/linux-amd64/helm
        dest: "{{ helm_install_binary_path }}"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Remove downloaded archive/staging files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/helm.tar.gz
        - /tmp/linux-amd64

    - name: Record the installed Helm version marker
      ansible.builtin.copy:
        content: "{{ helm_install_version }}\n"
        dest: "{{ helm_install_version_marker }}"
        owner: root
        group: root
        mode: "0644"
