---
- name: Ensure the Open WebUI stack directory exists
  ansible.builtin.file:
    path: "{{ open_webui_install_dir }}"
    state: directory
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0755"

- name: Deploy the Open WebUI compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ open_webui_install_dir }}/compose.yaml"
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0644"
  register: open_webui_install_compose_file

- name: Start the Open WebUI stack
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ open_webui_install_dir }}"
  when: open_webui_install_compose_file.changed
