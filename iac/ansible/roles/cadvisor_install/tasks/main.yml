---
- name: Ensure the cAdvisor stack directory exists
  ansible.builtin.file:
    path: "{{ cadvisor_install_dir }}"
    state: directory
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0755"

- name: Deploy the cAdvisor compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ cadvisor_install_dir }}/compose.yaml"
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0644"
  register: cadvisor_install_compose_file

- name: Start the cAdvisor stack
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ cadvisor_install_dir }}"
  when: cadvisor_install_compose_file.changed
