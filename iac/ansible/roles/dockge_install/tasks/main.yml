---
- name: Ensure the Dockge stack directory exists
  ansible.builtin.file:
    path: "{{ dockge_dir }}"
    state: directory
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0755"

- name: Deploy the Dockge compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ dockge_dir }}/compose.yaml"
    owner: "{{ admin_user_name }}"
    group: "{{ admin_user_name }}"
    mode: "0644"
  register: dockge_compose_file

- name: Start the Dockge stack
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ dockge_dir }}"
  when: dockge_compose_file.changed
