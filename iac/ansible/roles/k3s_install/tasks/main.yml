---
# k3s requires swap disabled.
- name: Disable swap
  ansible.builtin.command: swapoff -a
  when: (ansible_facts.memory_mb.swap.total | default(0)) > 0
  changed_when: true

- name: Remove swap entries from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

- name: Load kernel modules k3s needs (overlay networking, bridged traffic) at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Ensure the k3s kernel modules are loaded now
  ansible.builtin.command: modprobe {{ item }}
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Configure sysctl for k3s networking
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
    reload: true
  loop:
    - { name: net.ipv4.ip_forward, value: "1" }
    - { name: net.bridge.bridge-nf-call-iptables, value: "1" }
    - { name: net.bridge.bridge-nf-call-ip6tables, value: "1" }

# CoreDNS's forward plugin watches this file for changes and reloads it
# automatically, so future edits here don't need a restart.
- name: Ensure the k3s config directory exists
  ansible.builtin.file:
    path: "{{ k3s_install_resolv_conf | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write a static resolv.conf for k3s/CoreDNS to forward through
  ansible.builtin.copy:
    dest: "{{ k3s_install_resolv_conf }}"
    content: |
      nameserver {{ opnsense_host }}
      search {{ local_domain }}
    owner: root
    group: root
    mode: "0644"

- name: Check the currently installed k3s version
  ansible.builtin.command: k3s --version
  register: k3s_install_installed_version
  changed_when: false
  failed_when: false

- name: Check whether the running k3s service already has the desired install flags
  ansible.builtin.command: >-
    grep -qF -- '--resolv-conf {{ k3s_install_resolv_conf }}'
    /etc/systemd/system/{{ 'k3s' if 'prod_control_plane' in group_names else 'k3s-agent' }}.service
  register: k3s_install_flags_check
  changed_when: false
  failed_when: false

- name: Determine whether k3s needs to be (re)installed
  ansible.builtin.set_fact:
    k3s_install_needed: >-
      {{ k3s_install_installed_version.rc != 0
         or k3s_version not in k3s_install_installed_version.stdout
         or k3s_install_flags_check.rc != 0 }}

- name: Download the k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"
  when: k3s_install_needed

- name: Install k3s server
  ansible.builtin.command: >-
    /usr/local/bin/k3s-install.sh server {{ k3s_install_server_extra_args | join(' ') }}
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  when:
    - k3s_install_needed
    - "'prod_control_plane' in group_names"

# Slurped unconditionally (not just on fresh install) - later plays in the
# same run need this fact even when the server was already installed and
# this task didn't run above.
- name: Read the k3s server node-token
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_install_node_token_raw
  when: "'prod_control_plane' in group_names"

# Read via hostvars[groups['prod_control_plane'][0]] in the workers play -
# only works because the control-plane play runs first in the same
# ansible-playbook invocation (see playbooks/k3s_cluster.yml).
- name: Expose the node-token as a fact for the workers play
  ansible.builtin.set_fact:
    k3s_install_node_token: "{{ k3s_install_node_token_raw.content | b64decode | trim }}"
  when: "'prod_control_plane' in group_names"

- name: Install k3s agent
  ansible.builtin.command: >-
    /usr/local/bin/k3s-install.sh agent {{ k3s_install_agent_extra_args | join(' ') }}
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: "https://{{ hostvars[groups[k3s_install_control_plane_group][0]]['ansible_host'] }}:{{ k3s_install_api_port }}"
    K3S_TOKEN: "{{ hostvars[groups[k3s_install_control_plane_group][0]]['k3s_install_node_token'] }}"
  no_log: true
  when:
    - k3s_install_needed
    - "'prod_workers' in group_names"

- name: Ensure the k3s service is enabled and running
  ansible.builtin.systemd:
    name: "{{ 'k3s' if 'prod_control_plane' in group_names else 'k3s-agent' }}"
    enabled: true
    state: started
