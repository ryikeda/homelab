---
control_plane_group: prod_control_plane
k3s_api_port: 6443

# Disabled so the existing standalone Traefik LXC stays the one ingress
# path for everything in this fleet, consistent with gpu-box/palantir
# services - not k3s's own bundled ones.
k3s_server_extra_args:
  - --write-kubeconfig-mode
  - "644"
  - --disable
  - traefik
  - --disable
  - servicelb
