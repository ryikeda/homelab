---
k3s_install_control_plane_group: prod_control_plane
k3s_install_api_port: 6443

# Deliberately NOT /run/systemd/resolve/resolv.conf - that file merges
# every nameserver systemd-resolved knows about (our own drop-in AND
# whatever the interface/cloud-init default already had, e.g. 8.8.8.8),
# and CoreDNS's forward plugin load-balances across all of them. Since
# 8.8.8.8 has no idea what local_domain is, that's an intermittent ~50%
# NXDOMAIN rate for every internal hostname. A dedicated static file with
# only the real nameserver removes the ambiguity entirely.
k3s_install_resolv_conf: /etc/rancher/k3s/resolv.conf

k3s_install_server_extra_args:
  - --write-kubeconfig-mode
  - "644"
  - --disable
  - traefik
  - --disable
  - servicelb
  - --resolv-conf
  - "{{ k3s_install_resolv_conf }}"

k3s_install_agent_extra_args:
  - --resolv-conf
  - "{{ k3s_install_resolv_conf }}"
