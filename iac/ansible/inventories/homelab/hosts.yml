---
all:
  children:
    proxmox:
      hosts:
        pve:
          ansible_host: "{{ pve_host }}"
    linux:
      hosts: {}
    dns:
      hosts:
        technitium:
          ansible_host: "{{ technitium_host }}"
    reverse_proxy:
      hosts:
        traefik:
          ansible_host: "{{ traefik_host }}"
    gpu:
      hosts:
        gpu-box:
          ansible_host: "{{ gpu_host }}"
    monitoring:
      hosts:
        palantir:
          ansible_host: "{{ palantir_host }}"
    container_management:
      hosts:
        portainer:
          ansible_host: "{{ portainer_host }}"
    opnsense:
      hosts:
        router:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
