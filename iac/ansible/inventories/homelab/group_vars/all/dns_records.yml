---
technitium_dns_records:
  - name: "technitium.{{ local_domain }}"
    ip: "{{ technitium_host }}"
  - name: "router.{{ local_domain }}"
    ip: "{{ opnsense_host }}"
  - name: "traefik.{{ local_domain }}"
    ip: "{{ traefik_host }}"
  - name: "pve.{{ local_domain }}"
    ip: "{{ traefik_host }}"
  - name: "gpu-box.{{ local_domain }}"
    ip: "{{ gpu_host }}"
  - name: "dockge.{{ local_domain }}"
    ip: "{{ traefik_host }}"
  - name: "jellyfin.{{ local_domain }}"
    ip: "{{ traefik_host }}"
