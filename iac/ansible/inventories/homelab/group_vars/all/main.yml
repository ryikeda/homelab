---
initial_user: root
# Keep real passwords out of git. Put local values in an ignored file:
#   inventories/homelab/group_vars/all/local.yml
initial_password: ""

admin_user_name: ansible
# This must be a Linux password hash, not the plaintext password.
# Generate one locally with one of:
#   mkpasswd --method=yescrypt
#   openssl passwd -6
# Then put it in inventories/homelab/group_vars/all/local.yml.
# Proxmox pam users authenticate with the plaintext password that matches this hash.
admin_user_password_hash: ""
admin_user_update_password: on_create
admin_user_groups:
  - sudo
admin_user_shell: /bin/bash
admin_user_sudo_nopasswd: true

admin_user_ssh_key_name: ansible
admin_user_ssh_key_dir: "{{ lookup('env', 'HOME') }}/.ssh"
admin_user_ssh_key_path: "{{ admin_user_ssh_key_dir }}/{{ admin_user_ssh_key_name }}"
admin_user_ssh_pubkey_path: "{{ admin_user_ssh_key_path }}.pub"
admin_user_ssh_generate_local_key: true

common_packages: []
updates_auto_reboot: false
updates_reboot_timeout_seconds: 300

# Every host is Debian/Ubuntu with python3 at this path - set once here
# instead of repeated per-host in hosts.yml. Skips Ansible's interpreter
# auto-detection round-trip and avoids ambiguity. router (opnsense) is the
# one exception - it overrides this directly in hosts.yml since it needs a
# specific interpreter with the httpx package for the ansibleguy.opnsense
# modules, and host-level inventory vars take precedence over this default.
ansible_python_interpreter: /usr/bin/python3

# Where docker-compose stacks get deployed on any docker_install'd host -
# gpu-box (dockge/jellyfin/ollama/open_webui), palantir (prometheus/
# grafana), and rivendell (postgres/mongodb/seaweedfs/cloudbeaver) all use
# this.
docker_stacks_dir: /opt/stacks
