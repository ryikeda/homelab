---
reverse_proxy_sites:
  - hostname: "pve.{{ local_domain }}"
    upstream: "https://{{ pve_host }}:8006"
    # Proxmox's web UI serves its own self-signed cert - skip verifying it
    # on the upstream leg (the reverse proxy still terminates a real,
    # trusted cert for clients). Same reasoning as proxmox_insecure in
    # iac/opentofu.
    insecure_skip_verify: true
  - hostname: "jellyfin.{{ local_domain }}"
    upstream: "http://{{ gpu_host }}:8096"
  - hostname: "ollama.{{ local_domain }}"
    upstream: "http://{{ gpu_host }}:11434"
  - hostname: "openwebui.{{ local_domain }}"
    upstream: "http://{{ gpu_host }}:8080"
  - hostname: "portainer.{{ local_domain }}"
    upstream: "http://{{ portainer_host }}:9000"
  - hostname: "grafana.{{ local_domain }}"
    upstream: "http://{{ palantir_host }}:3000"
  - hostname: "prometheus.{{ local_domain }}"
    upstream: "http://{{ palantir_host }}:9090"
