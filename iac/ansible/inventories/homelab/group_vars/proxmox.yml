---
ansible_user: "{{ admin_user_name }}"
ansible_ssh_private_key_file: "{{ admin_user_ssh_key_path }}"

proxmox_admin_user_required_packages:
  - sudo

proxmox_admin_user_manage_admin_user: true
proxmox_admin_user_realm: pam
proxmox_admin_user_comment: "Ansible management user"
proxmox_admin_user_acl_path: /
proxmox_admin_user_role: Administrator

proxmox_opentofu_user_manage_user: true
proxmox_pve_exporter_user_manage_user: true
