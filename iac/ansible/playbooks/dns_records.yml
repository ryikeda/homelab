---
# Converges the declared list of known/stable DNS records (technitium_dns_records,
# see group_vars/all/dns_records.yml). For a single ad-hoc record - e.g. a
# newly-provisioned VM with a DHCP-assigned IP - use dns_record.yml instead.
#
# The declared list is treated as authoritative: any A record in the zone
# that isn't in it gets deleted below.
- name: Converge declared DNS records in Technitium
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    technitium_api_token: "{{ lookup('file', lookup('env', 'HOME') + '/.technitium/ansible.env') | trim }}"
  tasks:
    - name: Ensure each declared record exists
      ansible.builtin.include_tasks: ../tasks/technitium_record.yml
      loop: "{{ technitium_dns_records }}"
      loop_control:
        loop_var: record
        label: "{{ record.name }}"
      vars:
        dns_name: "{{ record.name }}"
        dns_ip: "{{ record.ip }}"

    - name: Fetch every record currently in the zone
      ansible.builtin.uri:
        url: "http://{{ technitium_host }}:5380/api/zones/records/get?domain={{ local_domain | urlencode }}&zone={{ local_domain | urlencode }}&listZone=true"
        method: GET
        headers:
          Authorization: "Bearer {{ technitium_api_token }}"
        status_code: 200
      register: technitium_zone_records

    - name: Fail if Technitium reported an error fetching the zone
      ansible.builtin.assert:
        that: technitium_zone_records.json.status == 'ok'
        fail_msg: "{{ technitium_zone_records.json | to_json }}"

    - name: Determine which A records are no longer declared
      ansible.builtin.set_fact:
        technitium_stale_records: >-
          {{
            technitium_zone_records.json.response.records
            | selectattr('type', 'equalto', 'A')
            | rejectattr('name', 'in', technitium_dns_records | map(attribute='name') | list)
            | list
          }}

    - name: Report records about to be pruned
      ansible.builtin.debug:
        msg: "Pruning stale A record: {{ item.name }} -> {{ item.rData.ipAddress }}"
      loop: "{{ technitium_stale_records }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Delete stale A records no longer declared
      vars:
        technitium_query: "domain={{ item.name | urlencode }}&zone={{ local_domain | urlencode }}&type=A&ipAddress={{ item.rData.ipAddress | urlencode }}"
      ansible.builtin.uri:
        url: "http://{{ technitium_host }}:5380/api/zones/records/delete?{{ technitium_query }}"
        method: POST
        headers:
          Authorization: "Bearer {{ technitium_api_token }}"
        status_code: 200
      loop: "{{ technitium_stale_records }}"
      loop_control:
        label: "{{ item.name }}"
      register: technitium_delete_response
      changed_when: true

    - name: Fail if Technitium reported a delete error
      ansible.builtin.assert:
        that: item.json.status == 'ok'
        fail_msg: "{{ item.json | to_json }}"
      loop: "{{ technitium_delete_response.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: technitium_delete_response.results is defined
