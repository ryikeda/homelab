---
# Control-plane first, then workers - the workers play reads the join
# token out of the control-plane's hostvars (set as a fact by the first
# play), which only works within a single ansible-playbook run. See
# roles/k3s_install.
- name: Install the k3s control-plane
  hosts: prod_control_plane
  gather_facts: true
  become: true
  roles:
    - k3s_install

- name: Install k3s workers
  hosts: prod_workers
  gather_facts: true
  become: true
  roles:
    - k3s_install
