apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: {{ .Release.Namespace }}
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Homelab
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: ""
  docker.yaml: ""
  services.yaml: |
    - Media:
        - Jellyfin:
            href: https://jellyfin.{{ `{{HOMEPAGE_VAR_DOMAIN}}` }}
            description: Media server
    - AI:
        - Open WebUI:
            href: https://openwebui.{{ `{{HOMEPAGE_VAR_DOMAIN}}` }}
            description: LLM chat UI
        - Ollama:
            href: https://ollama.{{ `{{HOMEPAGE_VAR_DOMAIN}}` }}
            description: LLM inference API
    - Infrastructure:
        - Proxmox:
            href: https://pve.{{ `{{HOMEPAGE_VAR_DOMAIN}}` }}
            description: Hypervisor
        - Portainer:
            href: https://portainer.{{ `{{HOMEPAGE_VAR_DOMAIN}}` }}
            description: Docker fleet management
        - Argo CD:
            href: https://argocd.{{ `{{HOMEPAGE_VAR_DOMAIN}}` }}
            description: GitOps for the k3s cluster
    - Monitoring:
        - Grafana:
            href: https://grafana.{{ `{{HOMEPAGE_VAR_DOMAIN}}` }}
            description: Dashboards
        - Prometheus:
            href: https://prometheus.{{ `{{HOMEPAGE_VAR_DOMAIN}}` }}
            description: Metrics
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
