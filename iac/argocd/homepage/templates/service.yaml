# ClusterIP - routed to from the LAN via the in-cluster Traefik ingress
# controller (see templates/ingressroute.yaml and
# iac/argocd/apps/ingress-controller.yaml), not exposed directly.
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: homepage
