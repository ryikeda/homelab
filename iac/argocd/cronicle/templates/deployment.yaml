# Single replica, genuinely stateless (Storage.engine: S3 in
# configmap.yaml points Cronicle at SeaweedFS on rivendell instead of
# local disk) - no PVC, freely reschedulable, nothing lost if this pod is
# ever pruned. See README.md for why this lives in k8s at all despite the
# rest of the DB/bucket tier deliberately not.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cronicle
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cronicle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cronicle
    spec:
      # Merges the non-secret config.json.template (configmap.yaml) with
      # the S3 credentials (Sealed Secret, see README.md) into the real
      # config.json Cronicle reads at startup - keeps the secret values
      # out of the ConfigMap entirely.
      initContainers:
        - name: render-config
          image: busybox:stable
          command:
            - sh
            - -c
            - |
              sed -e "s|\${S3_ENDPOINT}|$S3_ENDPOINT|g" \
                  -e "s|\${S3_ACCESS_KEY}|$S3_ACCESS_KEY|g" \
                  -e "s|\${S3_SECRET_KEY}|$S3_SECRET_KEY|g" \
                  /config-template/config.json.template > /config-rendered/config.json
          envFrom:
            - secretRef:
                name: {{ .Values.s3SecretName }}
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: config-rendered
              mountPath: /config-rendered
      containers:
        # Entrypoint/config path are the official cronicle/cronicle
        # image's documented behavior as of this chart's authoring -
        # verify against https://hub.docker.com/r/cronicle/cronicle
        # before first deploy.
        - name: cronicle
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CRONICLE_manager
              value: "1"
          ports:
            - name: http
              containerPort: 3012
              protocol: TCP
          volumeMounts:
            - name: config-rendered
              mountPath: /opt/cronicle/data
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config-template
          configMap:
            name: cronicle-config
        - name: config-rendered
          emptyDir: {}
