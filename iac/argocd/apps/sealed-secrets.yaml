apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    # Bump deliberately - check
    # https://github.com/bitnami/sealed-secrets/releases for the
    # controller version and its matching helm chart version (the chart
    # and controller version numbers differ - see the chart's own release
    # notes).
    targetRevision: 2.19.1
    helm:
      # Namespace and fullnameOverride must match the release this
      # replaced exactly - the controller's signing key is a Secret keyed
      # to that identity, and kubeseal (run locally) looks for a
      # controller named this, in this namespace, by default.
      values: |
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
